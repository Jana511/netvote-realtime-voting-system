<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results – NetVote</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f6fde%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3ENV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="page-head row" style="justify-content:space-between">
      <div>
        <h1>Results</h1>
        <p>The current poll and every poll that has been closed.</p>
      </div>
      <button id="csvBtn" type="button" class="ghost">Download history (CSV)</button>
    </div>

    <section class="card">
      <h2>Current poll <span id="curStatus" class="pill" style="margin-left:6px">No poll</span></h2>
      <h3 id="curQuestion">No poll is running.</h3>
      <div id="curBars" class="results"></div>
      <p id="curMeta" class="small muted" style="margin:12px 0 0"></p>
    </section>

    <section class="section">
      <h2>Poll history <span id="histCount" class="muted small"></span></h2>
      <p class="lead">Closed polls, newest first.</p>
      <div id="history" class="history"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
